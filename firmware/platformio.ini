; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; Master: ESP32 mit Schluessel, Laser, Handrad, GUI-Anbindung und UARTs zu den Achsmodulen
[env:esp32]
platform = espressif32@6.5.0
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<*>
    -<slave/>
    -<motortest/>
    -<as5600.cpp>
    -<stepper_tmc2209.cpp>
    -<position_control.cpp>

; Achsmodul: Nano mit AS5600 + TMC2209, gesteuert per USB oder RX/TX
[env:axis_nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
lib_deps =
    teemuatlut/TMCStepper
    waspinator/AccelStepper
build_src_filter =
    -<*>
    +<as5600.cpp>
    +<stepper_tmc2209.cpp>
    +<position_control.cpp>
    +<settings.cpp>
    +<status_leds.cpp>
    +<slave/>

; Motortest: nur TMC2209 per UART einstellen und mit festem Takt drehen, siehe src/motortest/
[env:motor_test]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps =
    teemuatlut/TMCStepper
build_src_filter =
    -<*>
    +<motortest/>
